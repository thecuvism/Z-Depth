<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ZERO Depth v7.52</title>
<style>
  :root{
    /* 레퍼런스 팔레트: Black / Prussian Blue #14213D / Orange #FCA311 / Alabaster #E5E5E5 / Brick Rust #C2C4C3 / White */
    --bg:#FFFFFF; --card:#E5E5E5; --ink:#000000; --dim:#8E9095; --faint:#C2C4C3;
    --line:#D6D8DB; --blue:#14213D; --blue2:#3D5480; --blue3:#93A3C4;
    --black:#000000; --gray:#8E9099; --red:#E5484D;
    --accent:#FCA311; --rust:#C2C4C3;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:'Helvetica Neue','Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif;}
  .wrap{max-width:480px; margin:0 auto; padding:26px 16px 50px;}
  .display{font-size:40px; font-weight:800; letter-spacing:-0.02em; line-height:1; margin:0;}
  .sub{font-size:12px; color:var(--dim); margin-top:8px;}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:22px;}
  .full{grid-column:1/-1;}
  .card{background:var(--card); border-top:2px solid var(--black); padding:16px 15px 13px; position:relative;}
  .card .tt{font-size:12.5px; font-weight:700; letter-spacing:.02em; margin-bottom:10px;}
  .card .cap{font-size:10px; color:var(--faint); text-align:right; margin-top:10px;}
  .bignum{font-size:40px; font-weight:800; letter-spacing:-0.02em; color:var(--blue); line-height:1.05;}
  .bignum.ink{color:var(--ink);}
  .bignum small{font-size:20px; font-weight:800;}
  .mono{font-variant-numeric:tabular-nums;}
  .btn{display:block; width:100%; border:none; padding:17px; font-size:15px; font-weight:800;
    letter-spacing:.08em; cursor:pointer; color:#14213D; background:var(--accent);}
  .btn.ghost{background:var(--rust); color:#0A0A0A; border:none; font-weight:700; letter-spacing:0;}
  .btn.black{background:var(--black); color:#fff;}
  .link{background:none; border:none; color:var(--accent); font-size:13px; font-weight:700; cursor:pointer; padding:6px;}
  .dotbtn{width:24px; height:24px; border-radius:50%; background:var(--accent); border:none;
    color:#14213D; font-size:12px; font-weight:900; cursor:pointer; padding:0; line-height:24px; text-align:center;}
  .dotbtn.del{background:var(--rust); color:#3A3B3E;}
  .row2{display:flex; gap:10px;} .row2>*{flex:1;} .row2>.w2{flex:2;}
  .chips{display:flex; gap:8px; margin-top:12px;}
  .chips button{flex:1; background:var(--rust); color:#0A0A0A; border:none;
    padding:11px 0; font-size:13px; font-weight:600; cursor:pointer;}
  .amtbox{background:#fff; border:1.5px solid var(--ink); padding:16px;
    display:flex; align-items:baseline; gap:8px;}
  .amtbox input{flex:1; min-width:0; background:transparent; border:none; outline:none;
    color:var(--ink); font-size:30px; font-weight:700;}
  .catbox{background:#fff; border:1px solid var(--line); padding:12px 13px; margin-bottom:9px;}
  .catbox.on{border:1.5px solid var(--accent);}
  .catbox .nm{font-size:13.5px; font-weight:700;}
  .catbox .rm{font-size:11px; color:var(--dim); margin-top:1px;}
  .catbox input{width:100%; background:transparent; border:none; outline:none; color:var(--blue);
    font-size:22px; font-weight:800; margin-top:6px;}
  .catbox .mini{display:flex; gap:6px; margin-top:8px;}
  .catbox .mini button{flex:1; background:var(--rust); border:none; color:#0A0A0A;
    padding:8px 0; font-size:11.5px; font-weight:600; cursor:pointer;}
  input::placeholder{color:var(--faint);}
  button:focus-visible, input:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .kv{display:flex; justify-content:space-between; align-items:baseline; margin:9px 0;}
  .kv .k{font-size:13px; color:var(--dim);} .kv .v{font-size:15px; font-weight:600;}
  .kv.big .v{font-size:19px; font-weight:800;}
  .hr{height:1px; background:var(--line); margin:10px 0;}
  .entry{display:flex; justify-content:space-between; align-items:center;
    background:var(--card); border-top:2px solid var(--black); padding:13px 15px; margin-bottom:8px;}
  .pill{font-size:10.5px; border:1px solid var(--line); padding:4px 9px; color:var(--dim);}
  .step{display:flex; gap:10px; align-items:flex-start; padding:9px 0;}
  .step .ic{width:20px; height:20px; border-radius:50%; flex:0 0 20px; display:flex;
    align-items:center; justify-content:center; font-size:11px; font-weight:800; margin-top:1px;}
  .step.done .ic{background:var(--blue); color:#fff;}
  .step.now .ic{background:var(--black); color:#fff;}
  .step.wait .ic{background:#fff; border:1.5px solid var(--line); color:var(--faint);}
  .step .t{font-size:13.5px; font-weight:700;}
  .step .s{font-size:11.5px; color:var(--dim); margin-top:2px; line-height:1.45;}
  .step.wait .t{color:var(--dim); font-weight:500;}
  .setrow input{width:100%; background:#fff; border:1px solid var(--line); padding:12px; font-size:15px; color:var(--ink);}
  .eyebrow{font-size:10px; letter-spacing:.28em; color:var(--dim); font-weight:700;}
  svg text{font-family:inherit;}
  .barrow{display:flex; align-items:center; margin:7px 0;}
  .barrow .lab{flex:0 0 86px; font-size:11.5px; color:var(--dim);}
  .barrow .track{flex:1; height:22px; background:#fff; position:relative;}
  .barrow .fill{height:100%;}
  .barrow .pct{font-size:11px; font-weight:800; margin-left:8px; flex:0 0 74px; text-align:right;}
  @media(prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important;}}
</style>

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192-maskable.svg" sizes="192x192">
  <meta name="theme-color" content="#FCA311">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ZERO Depth">
  </head>
<body>
<div class="wrap" id="app"></div>
<button id="refreshBtn" onclick="hardRefresh()" style="position:fixed;bottom:14px;right:14px;
  background:var(--black);color:#fff;border:none;padding:9px 16px;border-radius:20px;font-size:11px;font-weight:700;
  letter-spacing:.03em;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.25);z-index:999">↻ 업데이트</button>
<script>
/* ═══════ 상태 ═══════ */
const KEY='soc-debt-weekly-v1';
const CAT_DEF=[
  {name:'신용카드', amount:0, subs:[
    {name:'', amount:0},
  ]},
  {name:'사업대출', amount:0, subs:[
    {name:'', amount:0},
  ]},
];
const REV_DEF=['사업 매출','개인 매출'];
const DEF={annualRate:0, planMonthly:0, entries:[], debts:CAT_DEF, revCats:REV_DEF, syncToken:''};
/* 과거 하드코딩 실적 데이터는 v7.1에서 제거함 (소스 공개로 인한 매출 노출 방지).
   과거 월별 실적이 필요하면 동기화된 실제 기록(S.entries) 또는 인증된 백엔드 시트에서 가져올 것 — 클라이언트 소스에 절대 하드코딩하지 않는다. */
const HIST_CAT={};
const SCEN_START='2026-07';
const PAL=['#14213D','#FCA311','#3D5480','#8E9099','#C2C4C3'];

let S=null, screen='home', draft={revBy:{},repayBy:{},cardUse:0};
let saveErr=false, memoryOnly=false, syncState='';
let histList=null, pulledNote='';
let importRows=null, importErr='';
let saving=false;            /* 저장 중 이중클릭 방지 */
let lastSaveNote='';         /* 홈 상단 저장 완료 배너 */
let testResult='';           /* 설정 > 연결 테스트 결과 */
let editingId=null;          /* 기록 수정 모드: 대상 entry id */
let showAllRecords=false;    /* 레코드 목록 펼침 (기본 3건 → 최대 10건) */

const fmt=n=>(n==null||isNaN(n))?'0':Math.round(n).toLocaleString('ko-KR');
const fmtM=n=>{const m=n/10000; return m>=10000?(m/10000).toFixed(1).replace(/\.0$/,'')+'억':Math.round(m).toLocaleString('ko-KR')+'만';};
const sign=n=>n>=0?'+'+fmt(n):'−'+fmt(Math.abs(n));
const pnum=s=>{const v=parseInt(String(s).replace(/[^0-9]/g,''),10);return isNaN(v)?0:v;};
const dlab=iso=>{const d=new Date(iso);return (d.getMonth()+1)+'/'+d.getDate();};
const fdate=d=>d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');
const ymOf=iso=>iso.slice(0,7);
const ymAdd=(ym,k)=>{const[y,m]=ym.split('-').map(Number);const t=(y*12+m-1)+k;
  return Math.floor(t/12)+'-'+String(t%12+1).padStart(2,'0');};
const ymLab=ym=>ym.slice(2,4)+"'"+ym.slice(5);
const nowYM=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* 상대시간: '방금 전' / 'n분 전' … */
const rel=iso=>{ if(!iso) return '없음';
  const s=(Date.now()-new Date(iso).getTime())/1000;
  if(s<0) return '방금 전';
  if(s<60) return '방금 전';
  if(s<3600) return Math.floor(s/60)+'분 전';
  if(s<86400) return Math.floor(s/3600)+'시간 전';
  return Math.floor(s/86400)+'일 전';
};
const tlab=iso=>iso?new Date(iso).toLocaleString('ko-KR'):'—';
/* 동기화 로그 (최근 8건, 상태와 함께 저장) */
function slog(type,msg,ok){
  S.syncLog=(S.syncLog||[]).slice(-4);
  S.syncLog.push({t:new Date().toISOString(),type,msg,ok:!!ok});
}
/* 부채 '단위' = 세부 항목이 있으면 세부, 없으면 유형 자체 */
function units(){
  const u=[];
  S.debts.forEach(d=>{
    const subs=(d.subs||[]).filter(s=>s.name&&s.amount>0);
    if(subs.length) subs.forEach(s=>u.push({cat:d.name,name:s.name,amount:s.amount,key:d.name+'|'+s.name}));
    else if(d.amount>0) u.push({cat:d.name,name:d.name,amount:d.amount,key:d.name});
  });
  return u;
}
const baseline=()=>units().reduce((s,u)=>s+u.amount,0);
const repayTotal=()=>Object.values(draft.repayBy).reduce((s,v)=>s+(v||0),0);
const revTotal=()=>Object.values(draft.revBy||{}).reduce((s,v)=>s+(v||0),0);
const unitLabel=k=>k.indexOf('|')>=0?k.split('|')[1]:k;

/* 저장 어댑터: 클로드 저장소 → 폰 브라우저 저장소 → 메모리 */
const store={
  async get(){
    if(window.storage){
      try{const r=await window.storage.get(KEY);if(r&&r.value!=null)return r.value;}catch(e){}
    }
    try{return localStorage.getItem(KEY);}catch(e){return null;}
  },
  /* v5.4 치명 버그 수정: set(v) 1개 인자 정의에 (KEY,데이터) 2개를 넘겨
     데이터 대신 키 문자열이 저장 → 재실행 시 JSON 파싱 실패로 기록 전체 초기화되던 문제 */
  async set(k,v){
    let ok=false;
    if(window.storage){
      try{await window.storage.set(k,v);ok=true;}catch(e){}
    }
    try{localStorage.setItem(k,v);ok=true;}catch(e){}
    return ok;
  },
  available(){ if(window.storage)return true;
    try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true;}catch(e){return false;} }
};
async function load(){
  try{
    if(!store.available()) throw 0;
    const r=await store.get(KEY);
    const p=r?JSON.parse(r):{};
    S={...DEF,...p};
    if(!S.debts){
      const cardSum=p.cards?p.cards.reduce((s,c)=>s+c.amount,0):(p.baselineDebt||62000000);
      S.debts=CAT_DEF.map(d=>d.name==='카드'?{...d,subs:[],amount:cardSum}:{...d,subs:[]});
    }
    S.debts=S.debts.map(d=>({subs:[],...d}));
    if(!S.revCats) S.revCats=REV_DEF;
  }catch(e){ S={...DEF}; if(!store.available()) memoryOnly=true; }
  render();
  pullSync();
}
/* 1단계: 기기 저장 — 항상 먼저, 전송과 무관하게 성공/실패 확정 */
async function persistLocal(){
  try{
    const ok=await store.set(KEY,JSON.stringify(S));
    saveErr=!ok; memoryOnly=!ok&&!store.available();
    return ok;
  }catch(e){ saveErr=true; return false; }
}
/* 2단계: 기기 저장 후 시트 전송(백그라운드) */
async function persist(){
  await persistLocal();
  pushSync();
}

/* ═══════ 구글 시트 동기화 (양방향) ═══════ */
function syncRows(){
  const ch=chain(); const base=baseline();
  return {
    token: S.syncToken,
    state:S,   /* 전체 상태 저장 → 다른 기기/복구에서 그대로 불러옴 */
    entries: ch.rows.map(r=>({date:r.date.slice(0,10),type:r.type==='adjust'?'잔액보정':'주간기록',
      revenue:r.revenue||0,repay:r.repay||0,
      detail:r.repayBy?Object.entries(r.repayBy).filter(([k,v])=>v>0).map(([k,v])=>unitLabel(k)+' '+fmt(v)).join(' / '):'',
      cardUse:r.cardUse||0,interest:r.interest||0,net:r.net==null?'':r.net,balanceAfter:r.balanceAfter})),
    meta:{baseline:base,balance:ch.balance,
      paidPct:base>0?((base-ch.balance)/base*100).toFixed(1):0,
      debts:(()=>{const g={};ch.units.forEach(u=>{g[u.cat]=(g[u.cat]||0)+u.left;});
        return Object.entries(g).map(([name,amount])=>({name,amount}));})(),
      units:ch.units.map(u=>({name:u.name,cat:u.cat,left:u.left})),app:'ZERO Depth v7.52'}
  };
}
async function pushSync(manual){
  if(!S.syncUrl){ if(manual) alert('설정에서 Apps Script URL을 먼저 저장하세요.'); return; }
  syncState='sending'; render();
  try{
    const res=await fetch(S.syncUrl,{method:'POST',
      headers:{'Content-Type':'text/plain'},body:JSON.stringify(syncRows())});
    let ok=true;
    try{ const j=await res.json(); ok=!(j&&j.ok===false); }catch(e){}
    if(ok){
      S.lastSync=new Date().toISOString(); S.pendingSync=false;
      syncState='sent'; slog('push','시트 전송 완료 ('+(S.entries||[]).length+'건 기준)',true);
    }else{
      S.pendingSync=true; syncState='blocked';
      slog('push','시트가 오류를 반환 — 스크립트 배포 버전 확인 필요',false);
    }
    await persistLocal();
  }catch(e){
    S.pendingSync=true; syncState='blocked';
    slog('push','전송 실패 (네트워크/차단) — 다음 실행 시 자동 재시도',false);
    await persistLocal();
  }
  render();
}
/* 연결 테스트: 시트에 GET 핑을 보내 응답 시간·상태 확인 */
async function testSync(){
  if(!S.syncUrl){ alert('설정에서 Apps Script URL을 먼저 저장하세요.'); return; }
  testResult='⏳ 테스트 중…'; render();
  const t0=Date.now();
  try{
    const res=await fetch(S.syncUrl+'?action=load&token='+encodeURIComponent(S.syncToken||''));
    const j=await res.json();
    const ms=Date.now()-t0;
    if(j&&j.ok){
      testResult='✅ 정상 연결 — 응답 '+ms+'ms'+(j.savedAt?' · 시트 최신 저장분 '+tlab(j.savedAt):'');
      slog('test','연결 테스트 성공 ('+ms+'ms)',true);
    }else{
      testResult='⚠ 응답은 왔지만 형식 이상 — 스크립트 v3 배포/새 버전 게시 확인';
      slog('test','연결 테스트: 응답 형식 이상',false);
    }
  }catch(e){
    testResult='❌ 연결 실패 — 인터넷/차단 문제. 클로드 미리보기라면 파일을 받아 폰 브라우저에서 여세요.';
    slog('test','연결 테스트 실패 (네트워크/차단)',false);
  }
  await persistLocal(); render();
}
/* 앱을 열 때 시트에 더 최신 데이터가 있으면 자동으로 불러온다 */
async function pullSync(){
  if(!S.syncUrl) return;
  try{
    const res=await fetch(S.syncUrl+'?action=load&token='+encodeURIComponent(S.syncToken||''));
    const j=await res.json();
    S.lastPull=new Date().toISOString();
    if(j&&j.ok&&j.state){
      const remote=j.state;
      const rN=(remote.entries||[]).length, lN=(S.entries||[]).length;
      const rT=remote.lastSync||'', lT=S.lastSync||'';
      if(rN>lN || (rT&&rT>lT&&rN>=lN)){
        const url=S.syncUrl, pend=S.pendingSync;
        S={...DEF,...remote,syncUrl:url,lastPull:S.lastPull,pendingSync:pend};
        if(!S.debts) S.debts=CAT_DEF;
        pulledNote='☁ 구글 시트의 최신 데이터를 불러왔습니다'+(j.savedAt?' ('+tlab(j.savedAt)+' 저장분)':'');
        slog('pull','시트 최신 데이터 불러옴',true);
        syncState='sent';
      }else{
        slog('pull','시트 확인 — 이 기기가 최신',true);
        if(syncState!=='sending') syncState='sent';
      }
      await persistLocal();
      render();
      /* 지난번 전송 실패분이 남아 있으면 자동 재시도 */
      if(S.pendingSync) pushSync();
    }
  }catch(e){ /* 클로드 미리보기 차단 등 — 조용히 통과 */ }
}
/* 백업 스냅샷 목록/복구 */
async function loadHistory(){
  if(!S.syncUrl){ alert('먼저 Apps Script URL을 저장하세요.'); return; }
  histList='loading'; render();
  try{
    const res=await fetch(S.syncUrl+'?action=history&token='+encodeURIComponent(S.syncToken||''));
    const j=await res.json();
    histList=(j&&j.ok&&j.list)?j.list:[];
  }catch(e){ histList=[]; alert('백업 목록을 불러오지 못했습니다.\n(클로드 미리보기에서는 통신이 차단될 수 있어요 — 폰 브라우저에서 시도하세요)'); }
  render();
}
async function restorePoint(ts){
  const h=(Array.isArray(histList)?histList:[]).find(x=>x.ts===ts);
  const label=h?new Date(h.ts).toLocaleString('ko-KR')+' · 기록 '+h.count+'건 · 잔액 ₩ '+fmt(h.balance):ts;
  if(!confirm('⏪ 백업 시점 복구 안내\n\n되돌아갈 시점:\n'+label+'\n\n지금 이 기기의 데이터가 위 시점의 백업으로 덮어써집니다.\n계속할까요?')) return;
  try{
    const res=await fetch(S.syncUrl+'?action=restore&ts='+encodeURIComponent(ts)+'&token='+encodeURIComponent(S.syncToken||''));
    const j=await res.json();
    if(j&&j.ok&&j.state){
      const url=S.syncUrl;
      S={...DEF,...j.state,syncUrl:url};
      if(!S.debts) S.debts=CAT_DEF;
      if(store.available()) await store.set(KEY,JSON.stringify(S));
      histList=null;
      alert('✅ 복구 완료\n\n'+label+'\n시점의 데이터로 되돌아갔습니다.\n(이 상태가 시트에도 다시 저장됩니다)');
      pushSync(); go('home');

/* ═══════ 계산: 세부 단위 잔액 체인 ═══════ */
function chain(){
  const us=units().map(u=>({...u,left:u.amount,end:null,firstPay:null}));
  const firstCardIdx=(()=>{const i=us.findIndex(u=>u.cat.indexOf('카드')>=0);return i<0?0:i;})();
  let bal=us.reduce((s,u)=>s+u.left,0);
  const rows=[];
  const paySpill=(amt,ym,pool)=>{ /* pool 순서대로 눈덩이 */
    let rem=amt;
    for(const u of pool){
      if(rem<=0)break; if(u.left<=0)continue;
      if(!u.firstPay)u.firstPay=ym;
      const p=Math.min(rem,u.left); u.left-=p; rem-=p;
      if(u.left<=0&&!u.end)u.end=ym;
    }
    return rem;
  };
  for(const e of S.entries){
    if(e.type==='adjust'){
      const target=Math.max(0,e.balance);
      const cur=us.reduce((s,u)=>s+u.left,0);
      if(cur>0){ let acc=0; const live=us.filter(u=>u.left>0);
        live.forEach((u,i)=>{ const v=(i===live.length-1)?(target-acc):Math.round(target*u.left/cur);
          u.left=Math.max(0,v); acc+=u.left; });
      } else if(us.length){ us[firstCardIdx].left=target; }
      bal=us.reduce((s,u)=>s+u.left,0);
      rows.push({...e,balanceAfter:bal,net:null,interest:0});
      continue;
    }
    const prev=bal;
    const interest=bal>0?Math.round(bal*S.annualRate/52):0;
    if(interest>0){
      const live=us.filter(u=>u.left>0); let acc=0;
      live.forEach((u,i)=>{ const v=(i===live.length-1)?(interest-acc):Math.round(interest*u.left/bal);
        u.left+=v; acc+=v; });
      if(!live.length&&us.length) us[firstCardIdx].left+=interest;
    }
    if(e.cardUse>0&&us.length){
      const t=us.find(u=>u.cat.indexOf('카드')>=0&&u.left>0)||us[firstCardIdx];
      t.left+=e.cardUse;
    }
    const ym=ymOf(e.date);
    let spill=0;
    if(e.repayBy){
      for(const[k,v]of Object.entries(e.repayBy)){
        if(!v||v<=0)continue;
        const exact=us.find(u=>u.key===k);
        if(exact){ spill+=paySpill(v,ym,[exact]); continue; }
        const catPool=us.filter(u=>u.cat===k);            /* 구버전 유형 키 */
        if(catPool.length){ spill+=paySpill(v,ym,catPool); continue; }
        spill+=v;
      }
    } else spill=e.repay||0;
    paySpill(spill,ym,us);
    bal=us.reduce((s,u)=>s+u.left,0);
    rows.push({...e,interest,net:prev-bal,balanceAfter:bal});
  }
  return {rows,balance:bal,units:us};
}
function paceOf(ch){
  const wk=ch.rows.filter(r=>r.type==='week');
  const rec=wk.slice(-8);
  const avg=rec.length?rec.reduce((s,r)=>s+r.net,0)/rec.length:0;
  const basis=(rec.length>=2&&avg>0)?'실적':'계획';
  return {basis,avgWeekly:avg};
}
function project(ch,pace){
  const planW=S.planMonthly*12/52 - ch.balance*S.annualRate/52;
  const weekly=pace.basis==='실적'?pace.avgWeekly:Math.max(planW,1);
  if(ch.balance<=0) return {done:true};
  if(weekly<=0) return {stalled:true};
  const weeks=Math.ceil(ch.balance/weekly);
  const d=new Date(); d.setDate(d.getDate()+weeks*7);
  return {date:d,weeks,basis:pace.basis};
}
function simulate(ch,pace){
  const us=ch.units.map(u=>({...u,startProj:null}));
  /* 유형별 상환시작일: 설정에서 지정 시 그 이전 달에는 배분하지 않음 */
  const startOf=cat=>{const d=S.debts.find(x=>x.name===cat);return (d&&d.startYM)?d.startYM:null;};
  const projMonthly=bal=>pace.basis==='실적'
    ? pace.avgWeekly*52/12
    : S.planMonthly - bal*S.annualRate/12;
  const hasThis=ch.rows.some(r=>r.type==='week'&&ymOf(r.date)===nowYM());
  let m=hasThis?ymAdd(nowYM(),1):nowYM();
  let bal=ch.balance, i=0, stalled=false;
  while(i<60 && us.some(u=>u.left>0)){
    let net=projMonthly(bal);
    if(net<=0){ stalled=true; break; }
    let rem=net;
    for(const u of us){
      if(u.left<=0||rem<=0) continue;
      const sy=startOf(u.cat);
      if(sy && m<sy) continue;               /* 시작일 전 → 이번 달은 건너뜀 */
      if(!u.startProj&&!u.firstPay) u.startProj=m;
      const p=Math.min(rem,u.left);
      u.left-=p; rem-=p;
      if(u.left<=0&&!u.end) u.end=m;
    }
    bal=Math.max(0,bal-(net-rem));           /* 실제 배분된 금액만 차감 */
    m=ymAdd(m,1); i++;
  }
  /* 단위 병합: 현재 잔액(ch) + 예상 완제(sim) */
  const mu=ch.units.map((u,i2)=>({
    cat:u.cat, name:u.name, key:u.key, amount:u.amount, left:u.left,
    end:u.end||us[i2].end,
    start:u.firstPay||us[i2].startProj||null,
    done:u.left<=0,
  }));
  /* 유형 단위 집계 (로드맵/도넛/막대용) */
  const order=S.debts.map(d=>d.name);
  const cats=order.map(cn=>{
    const g=mu.filter(u=>u.cat===cn);
    if(!g.length) return null;
    const done=g.every(u=>u.done);
    const ends=g.map(u=>u.end).filter(Boolean).sort();
    const starts=g.map(u=>u.start).filter(Boolean).sort();
    return {name:cn, amount:g.reduce((s,u)=>s+u.amount,0), left:g.reduce((s,u)=>s+u.left,0),
      done, end:ends.length===g.length?ends[ends.length-1]:(ends.length?ends[ends.length-1]:null),
      start:starts.length?starts[0]:null, subs:g};
  }).filter(Boolean);
  const lastEnd=cats.reduce((mx,c)=>c.end&&c.end>mx?c.end:mx,SCEN_START);
  return {cats, units:mu, stalled, lastEnd, today:nowYM()};
}

function donutSVG(cats){
  const total=cats.reduce((s,c)=>s+c.left,0);
  if(total<=0) return '<p style="font-size:13px;color:var(--dim)">모든 부채가 상환되었습니다.</p>';

    const[x0,y0]=p(a0),[x1,y1]=p(a1),[u1,v1]=q(a1),[u0,v0]=q(a0);
    g+='<path d="M'+x0+' '+y0+' A'+R+' '+R+' 0 '+big+' 1 '+x1+' '+y1+' L'+u1+' '+v1+' A'+r+' '+r+' 0 '+big+' 0 '+u0+' '+v0+' Z" fill="'+PAL[i%PAL.length]+'"/>';

/* 이번 달(1일~말일) 매출(수익) vs 매입(지출) 누적 추이 — 두 선의 간격으로 이번 달 수지 흐름을 즉시 파악 */
function currentMonthFlowSVG(ch){
  const ym=nowYM();
  const wk=ch.rows.filter(r=>r.type==='week'&&ymOf(r.date)===ym).sort((a,b)=>a.date<b.date?-1:1);
  if(!wk.length) return '<p style="font-size:12px;color:var(--dim);margin-top:8px">'+esc(ymLab(ym))+'에는 아직 기록이 없습니다.</p>';
  const[y,mo]=ym.split('-').map(Number);
  const daysInMonth=new Date(y,mo,0).getDate();
  const todayDay=Math.min(new Date().getDate(),daysInMonth);
  let cumRev=0,cumExp=0;
  const pts=wk.map(r=>{cumRev+=(r.revenue||0);cumExp+=(r.repay||0)+(r.cardUse||0);
    return {day:new Date(r.date).getDate(),rev:cumRev,exp:cumExp};});
  const seriesRev=[{day:1,v:0},...pts.map(p=>({day:p.day,v:p.rev}))];
  const seriesExp=[{day:1,v:0},...pts.map(p=>({day:p.day,v:p.exp}))];
  const W=400,H=150,padL=42,padR=8,padT=26,padB=34;
  const maxV=Math.max(cumRev,cumExp,1);
  const X=d=>padL+(W-padL-padR)*((Math.min(d,daysInMonth)-1)/((daysInMonth-1)||1));
  const Y=v=>padT+(H-padT-padB)*(1-v/maxV);
  const pathOf=series=>series.map((p,i)=>(i===0?'M':'L')+X(p.day).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  const dotsOf=(series,color)=>series.slice(1).map(p=>'<circle cx="'+X(p.day).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="3" fill="'+color+'" stroke="#fff" stroke-width="1"/>').join('');
  const dayMarks=[1,10,20,daysInMonth];
  const xLabels=dayMarks.map(d=>'<text x="'+X(d).toFixed(1)+'" y="'+(H-20)+'" font-size="10" fill="var(--faint)" text-anchor="middle">'+d+'일</text>').join('');
  const todayX=X(todayDay);
  const todayMark='<line x1="'+todayX.toFixed(1)+'" y1="'+(padT-8).toFixed(1)+'" x2="'+todayX.toFixed(1)+'" y2="'+Y(0).toFixed(1)+'" stroke="var(--dim)" stroke-width="1.2" stroke-dasharray="3 3"/>'
    +'<text x="'+todayX.toFixed(1)+'" y="'+(padT-11)+'" font-size="10" fill="var(--dim)" font-weight="800" text-anchor="middle">TODAY</text>';
  const grid='<line x1="'+padL+'" y1="'+Y(0).toFixed(1)+'" x2="'+(W-padR)+'" y2="'+Y(0).toFixed(1)+'" stroke="var(--line)"/>'
    +'<text x="'+(padL-6)+'" y="'+(Y(0)+3).toFixed(1)+'" font-size="10" fill="var(--faint)" text-anchor="end">0</text>'
    +'<text x="'+(padL-6)+'" y="'+(Y(maxV)+3).toFixed(1)+'" font-size="10" fill="var(--faint)" text-anchor="end">'+esc(fmtM(maxV))+'</text>';
  const gap=cumRev-cumExp;
  const gapTxt=gap>=0?'수입이 지출보다 '+fmtM(gap)+' 많음':'지출이 수입보다 '+fmtM(Math.abs(gap))+' 많음';
  const gapColor=gap>=0?'var(--blue)':'var(--red)';
  const legend='<g font-size="10" fill="var(--dim)">'
    +'<circle cx="'+padL+'" cy="'+(H-6)+'" r="3.2" fill="var(--blue)"/><text x="'+(padL+7)+'" y="'+(H-3)+'">매출(수익) 누적</text>'
    +'<circle cx="'+(padL+92)+'" cy="'+(H-6)+'" r="3.2" fill="var(--accent)"/><text x="'+(padL+99)+'" y="'+(H-3)+'">매입(지출) 누적</text>'
    +'</g>';
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="이번 달 매출 매입 추이">'
    +grid+xLabels+todayMark
    +'<path d="'+pathOf(seriesRev)+'" fill="none" stroke="var(--blue)" stroke-width="2"/>'+dotsOf(seriesRev,'var(--blue)')
    +'<path d="'+pathOf(seriesExp)+'" fill="none" stroke="var(--accent)" stroke-width="2"/>'+dotsOf(seriesExp,'var(--accent)')
    +legend+'</svg>'
    +'<div class="cap" style="text-align:left;margin-top:2px">'+esc(ymLab(ym))+' 누적: <b style="color:'+gapColor+'">'+gapTxt+'</b></div>';
}

  let hasLive=false;
  for(const r of ch.rows){
    if(r.type!=='week')continue;
    const m=ymOf(r.date);
    monthly[m]=monthly[m]||{};
    if(r.revBy&&Object.keys(r.revBy).length){
      hasLive=true;
      for(const[k,v]of Object.entries(r.revBy)){
        if(!v)continue;
        const key=catList.indexOf(k)>=0?k:'__misc';
        monthly[m][key]=(monthly[m][key]||0)+v;
      }
    } else if(r.revenue>0){ hasLive=true; monthly[m].__misc=(monthly[m].__misc||0)+r.revenue; }
  }
  const months=Object.keys(monthly).sort();
  const segs=[...catList.map((c,i)=>({key:c,label:c,color:PAL_R[i%PAL_R.length]})),
    {key:'__misc',label:'미분류/기타',color:MISC_COLOR}];
  const W=400,H=190,P=6,bot=22;
  const totals=months.map(m=>Object.values(monthly[m]).reduce((s,v)=>s+v,0));
  const max=Math.max(...totals,1);
  const n=months.length, gap=6;
  const bw=Math.min(38,(W-P*2-gap*(n-1))/n);
  const x=i=>P+i*(bw+gap);
  const y0=H-bot, plotH=H-bot-16;
  let g='';
  months.forEach((m,i)=>{
    let cy=y0;
    segs.forEach(sg=>{
      const v=monthly[m][sg.key]||0;
      if(v<=0)return;
      const h=Math.max(1.5,v/max*plotH);
      cy-=h;
      g+='<rect x="'+x(i)+'" y="'+cy+'" width="'+bw+'" height="'+h+'" fill="'+sg.color+'"/>';
    });
    g+='<text x="'+(x(i)+bw/2)+'" y="'+(cy-4)+'" font-size="10" font-weight="700" fill="var(--dim)" text-anchor="middle">'+esc(fmtM(totals[i]))+'</text>'
      +'<text x="'+(x(i)+bw/2)+'" y="'+(H-6)+'" font-size="10" fill="var(--faint)" text-anchor="middle">'+esc(m.slice(5))+'월</text>';
  });
  /* 사용 중인 세그먼트만 범례 표시 */
  const used=segs.filter(sg=>months.some(m=>(monthly[m][sg.key]||0)>0));
  const legend='<div style="display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px">'
    +used.map(sg=>'<span style="font-size:10px;color:var(--dim)"><span style="display:inline-block;width:9px;height:9px;background:'+sg.color+';margin-right:4px"></span>'+esc(sg.label)+'</span>').join('')
    +'</div>';
  return {svg:'<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="월별 매출 분류 스택">'+g+'</svg>'+legend, hasLive};
}
function balanceSVG(ch){
  const pts=[{v:baseline(),l:'시작'},...ch.rows.map(r=>({v:r.balanceAfter,l:dlab(r.date)}))];
  if(pts.length<2) return '';
  const W=400,H=150,P=38;
  const max=Math.max(...pts.map(p=>p.v),1);
  const x=i=>P+(W-P-10)*(i/(pts.length-1));
  const y=v=>10+(H-30)*(1-v/max);
  let path='M '+pts.map((p,i)=>x(i)+' '+y(p.v)).join(' L ');
  const dots=pts.map((p,i)=>'<circle cx="'+x(i)+'" cy="'+y(p.v)+'" r="3.2" fill="var(--blue)"/>').join('');
  const labels=pts.map((p,i)=>(pts.length>8&&i%2===1)?'':'<text x="'+x(i)+'" y="'+(H-4)+'" font-size="10" fill="var(--faint)" text-anchor="middle">'+esc(p.l)+'</text>').join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="잔액 추이">'+
    '<line x1="'+P+'" y1="'+y(0)+'" x2="'+(W-10)+'" y2="'+y(0)+'" stroke="var(--blue)" stroke-dasharray="4 4" opacity=".45"/>'+
    '<text x="4" y="'+(y(max)+4)+'" font-size="10" fill="var(--faint)">'+esc(fmtM(max))+'</text>'+
    '<text x="4" y="'+(y(0)+4)+'" font-size="10" fill="var(--faint)">0</text>'+
    '<path d="'+path+'" fill="none" stroke="var(--blue)" stroke-width="2.4"/>'+dots+labels+'</svg>';
}

/* ═══════ 진행 분석 (잘한 점 / 보완점) ═══════ */
function analysisBlock(ch,pace,sim,prevAvg,lastWeek){
  const wk=ch.rows.filter(r=>r.type==='week');
  if(!wk.length) return '<p style="font-size:12.5px;color:var(--dim)">아직 기록이 없습니다. 매주 기록이 쌓이면 잘한 점과 보완할 점을 자동으로 분석해 드립니다.</p>';
  const good=[],bad=[];
  const base=baseline(), paidAmt=base-ch.balance;
  const paidPct=base>0?paidAmt/base*100:0;
  /* 완제 항목 */
  const doneU=sim.units.filter(u=>u.done&&u.amount>0);
  if(doneU.length) good.push('🏁 완제 달성: '+doneU.map(u=>u.name).join(', ')+' — 눈덩이가 굴러가고 있습니다.');
  if(paidAmt>0) good.push('💪 지금까지 ₩ '+fmt(paidAmt)+' ('+paidPct.toFixed(1)+'%) 상환 — 시작이 절반입니다.');
  /* 주간 페이스 */
  if(lastWeek&&prevAvg!=null){
    if(lastWeek.net>prevAvg) good.push('📈 이번 주 순감소가 최근 4주 평균보다 ₩ '+fmt(lastWeek.net-prevAvg)+' 높습니다. 페이스 상승 중.');
    else if(lastWeek.net<prevAvg) bad.push('📉 이번 주 순감소(₩ '+fmt(lastWeek.net)+')가 4주 평균(₩ '+fmt(prevAvg)+')보다 낮습니다. 다음 주에 만회해 보세요.');
  }
  if(lastWeek&&lastWeek.net<0) bad.push('🚨 이번 주는 부채가 오히려 늘었습니다. 카드사용과 이자가 상환을 앞질렀어요.');
  /* 카드사용 비율 */
  const rec=wk.slice(-4);
  const useSum=rec.reduce((s,r)=>s+(r.cardUse||0),0), paySum=rec.reduce((s,r)=>s+(r.repay||0),0);
  if(paySum>0&&useSum/paySum>0.3) bad.push('💳 최근 4주 신규 카드사용이 상환액의 '+Math.round(useSum/paySum*100)+'%입니다. 30% 아래로 낮추면 완제가 눈에 띄게 빨라집니다.');
  else if(paySum>0&&useSum===0) good.push('🧊 최근 4주 신규 카드사용 0원 — 완벽한 지출 통제입니다.');
  /* 월 계획 대비 */
  if(pace.basis==='실적'){
    const monthlyPace=pace.avgWeekly*52/12;
    const ratio=S.planMonthly>0?monthlyPace/S.planMonthly:0;
    if(ratio>=1) good.push('🎯 실제 감소 페이스(월 ₩ '+fmt(monthlyPace)+')가 계획을 '+Math.round((ratio-1)*100)+'% 초과 달성 중입니다.');
    else if(ratio<0.8) bad.push('🐢 실제 페이스가 월 계획(₩ '+fmt(S.planMonthly)+')의 '+Math.round(ratio*100)+'%입니다. 완제일이 뒤로 밀리고 있어요.');
  }
  /* 매출 전월 비교 (기록 기반) */
  const revM={};
  wk.forEach(r=>{const m=ymOf(r.date);revM[m]=(revM[m]||0)+(r.revenue||0);});
  const rms=Object.keys(revM).sort();
  if(rms.length>=2){
    const a=revM[rms[rms.length-2]], b=revM[rms[rms.length-1]];
    if(b>a) good.push('🚀 이번 달 매출(₩ '+fmt(b)+')이 전월보다 '+Math.round((b/a-1)*100)+'% 성장 — 상환 여력이 커지고 있습니다.');
    else if(b<a*0.85) bad.push('🌧 이번 달 매출이 전월 대비 '+Math.round((1-b/a)*100)+'% 감소했습니다. 매출 분류 그래프에서 어느 항목이 빠졌는지 확인해 보세요.');
  }
  /* 기록 공백 */
  const gap=Math.floor((Date.now()-new Date(wk[wk.length-1].date).getTime())/86400000);
  if(gap>9) bad.push('🗓 마지막 기록이 '+gap+'일 전입니다. 주 1회 기록이 예측 정확도의 핵심이에요.');
  if(sim.stalled) bad.push('⚠ 현재 페이스로는 잔액이 줄지 않습니다. 상환액 확대 또는 카드사용 축소가 필요합니다.');
  const li=(arr)=>arr.slice(0,3).map(t=>'<div style="font-size:12.5px;line-height:1.65;margin:5px 0">'+t+'</div>').join('');
  return '<div style="font-size:12px;font-weight:800;color:var(--blue);margin-bottom:2px">👍 잘하고 있는 부분</div>'
    +(good.length?li(good):'<div style="font-size:12.5px;color:var(--dim);margin:5px 0">아직 눈에 띄는 성과가 없습니다. 이번 주 기록부터 시작!</div>')
    +'<div class="hr"></div>'
    +'<div style="font-size:12px;font-weight:800;color:var(--red);margin-bottom:2px">🔧 보완이 필요한 부분</div>'
    +(bad.length?li(bad):'<div style="font-size:12.5px;color:var(--dim);margin:5px 0">특별한 문제가 없습니다. 지금 페이스를 유지하세요!</div>');
}

/* ═══════ 이벤트 ═══════ */
function go(s){screen=s;confirmDelId=null;render();window.scrollTo(0,0);}
function startWizard(){draft={revBy:{},repayBy:{},cardUse:0};lastSaveNote='';editingId=null;go('s1');}
function onAmt(f,el){draft[f]=pnum(el.value);el.value=draft[f]?fmt(draft[f]):'';}
function addAmt(f,v){draft[f]=(draft[f]||0)+v;render();}
function clearAmt(f){draft[f]=0;render();}
/* 실시간 합계 갱신 */
function liveTotal(id,v){const el=document.getElementById(id);if(el)el.textContent='₩ '+fmt(v);}
/* STEP 1 매출 입력 (v5.4에서 정의 누락 → 입력 불가 버그의 원인) */
function onRev(name,el){draft.revBy[name]=pnum(el.value);el.value=draft.revBy[name]?fmt(draft.revBy[name]):'';
  el.closest('.catbox').classList.toggle('on',draft.revBy[name]>0);
  liveTotal('revTot',revTotal());}
function addRev(name,v){draft.revBy[name]=(draft.revBy[name]||0)+v;render();}
/* STEP 2 상환 입력 */
function onRepay(name,el){draft.repayBy[name]=pnum(el.value);el.value=draft.repayBy[name]?fmt(draft.repayBy[name]):'';
  el.closest('.catbox').classList.toggle('on',draft.repayBy[name]>0);
  liveTotal('repayTot',repayTotal());}
function addRepay(name,v){draft.repayBy[name]=(draft.repayBy[name]||0)+v;render();}
function setRepayAll(name,left){draft.repayBy[name]=left;render();}
function focusAmt(){const el=document.getElementById('amt');if(el)setTimeout(()=>el.focus(),60);}
async function saveWeek(){
  if(saving) return; saving=true;
  const btn=document.getElementById('saveBtn');
  if(btn){btn.disabled=true;btn.style.opacity='.6';btn.textContent='저장 중…';}
  const repayBy={}; Object.entries(draft.repayBy).forEach(([k,v])=>{if(v>0)repayBy[k]=v;});
  const revBy={}; Object.entries(draft.revBy||{}).forEach(([k,v])=>{if(v>0)revBy[k]=v;});
  if(editingId!=null){
    /* 수정 모드: id·날짜를 유지한 채 내용만 교체 → 잔액 체인 재계산 */
    const i=S.entries.findIndex(e=>e.id===editingId);
    if(i>=0){
      S.entries[i]={...S.entries[i],revenue:revTotal(),revBy,repay:repayTotal(),repayBy,cardUse:draft.cardUse||0};
    }
    editingId=null;
    const ok=await persistLocal();
    lastSaveNote=ok?'✏ 기록 수정 완료 — 잔액·예측이 재계산되었습니다':'⚠ 기기 저장 실패 — 임시 모드로 화면에만 반영되었습니다';
    draft={revBy:{},repayBy:{},cardUse:0}; saving=false;
    go('home'); pushSync(); return;
  }
  /* v5.4 버그 수정: revenue가 undefined로 저장되고 revBy가 통째로 누락되던 문제 */
  S.entries.push({type:'week',id:Date.now(),date:new Date().toISOString(),
    revenue:revTotal(),revBy,repay:repayTotal(),repayBy,cardUse:draft.cardUse||0});
  const ok=await persistLocal();
  lastSaveNote=ok
    ?'✅ 기록 저장 완료 ('+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})+')'
      +(S.syncUrl?' — 시트 전송 진행 중':'')
    :'⚠ 기기 저장 실패 — 임시 모드로 화면에만 반영되었습니다';
  draft={revBy:{},repayBy:{},cardUse:0}; saving=false;
  go('home');
  pushSync(); /* 전송은 백그라운드 — 결과는 상단 배지/설정 모니터에 표시 */
}
/* 삭제: 브라우저 confirm()은 미리보기 등 샌드박스에서 차단됨 → 자체 2단계 확인 */
let confirmDelId=null;
function askDel(id){confirmDelId=id;render();}
function cancelDel(){confirmDelId=null;render();}
function doDel(id){
  const e=S.entries.find(x=>x.id===id);
  confirmDelId=null;
  if(!e){render();return;}
  S.entries=S.entries.filter(x=>x.id!==id);
  if(editingId===id) editingId=null;
  lastSaveNote='🗑 기록 1건 삭제 완료 — 잔액이 재계산되었습니다';
  persist();render();
}
/* 기록 수정: 기존 3단계 마법사에 값을 채워서 재사용 */
function editEntry(id){
  const e=S.entries.find(x=>x.id===id&&x.type==='week');
  if(!e) return;
  editingId=id; confirmDelId=null;
  draft={revBy:{...(e.revBy||{})},repayBy:{...(e.repayBy||{})},cardUse:e.cardUse||0};
  lastSaveNote='';
  go('s1');
}
function toggleRecords(){showAllRecords=!showAllRecords;render();}
function dismissNote(k){if(k==='save')lastSaveNote='';else pulledNote='';render();}
function setPlan(){S.planMonthly=pnum(document.getElementById('set2').value);persist();render();}
function setRate(){const v=pnum(document.getElementById('set4').value);S.annualRate=Math.min(60,Math.max(0,v))/100;persist();render();}
function setDebtStart(i,v){
  if(!S.debts[i]) return;
  S.debts[i].startYM=(v&&/^\d{4}-\d{2}$/.test(v))?v:null;
  persist();render();
}
function adjustBal(){
  S.entries.push({type:'adjust',id:Date.now(),date:new Date().toISOString(),
    balance:pnum(document.getElementById('set3').value)});
  persist(); go('home');
}
/* ── 가져오기: 파싱/저장 ── */
function normDate(s){
  s=String(s||'').trim();
  let m=s.match(/(\d{4})[.\-\/년\s]+(\d{1,2})[.\-\/월\s]+(\d{1,2})/);
  if(m) return m[1]+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[3]).padStart(2,'0');
  if(/^\d{5}$/.test(s)){ // 엑셀 날짜 일련번호
    const d=new Date(Date.UTC(1899,11,30)+(+s)*86400000);
    return d.toISOString().slice(0,10);
  }
  return null;
}
function parseTable(rows){
  const out=[],errs=[];
  rows.forEach((r,idx)=>{
    if(!r||!r.length)return;
    const c=r.map(x=>String(x==null?'':x).trim());
    if(idx===0&&(c[0]==='날짜'||c[1]==='구분'))return;
    if(!c.join(''))return;
    const k=c[1]||'';
    const kind=k.indexOf('상환')>=0?'repay':(k.indexOf('카드사용')>=0||k==='카드')?'card':(k.indexOf('부채설정')>=0||k.indexOf('부채유형')>=0)?'debtset':'rev';
    const amt=pnum(c[3]||c[2]);
    if(kind==='debtset'){
      if(!c[2]){errs.push((idx+1)+'행: 부채설정 항목명 누락');return;}
      out.push({date:c[0]||'',kind,item:c[2],amt});
      return;
    }
    const date=normDate(c[0]);
    if(!date){errs.push((idx+1)+'행: 날짜를 읽지 못함 ('+c[0]+')');return;}
    if(!amt)return;
    out.push({date,kind,item:c[2]||'',amt});
  });
  return {out,errs};
}
function applyParsed(res){
  importRows=res.out;
  importErr=res.errs.length?('일부 행을 건너뜀: '+res.errs.slice(0,3).join(' / ')):(res.out.length?'':'인식된 데이터가 없습니다. 열 순서(날짜/구분/항목/금액)를 확인하세요.');
  render();
}
function parsePaste(){
  const t=(document.getElementById('pasteBox')||{value:''}).value.trim();
  if(!t){importErr='붙여넣은 내용이 없습니다.';render();return;}
  let rows;
  if(t[0]==='['){ /* JSON 지원 */
    try{ const j=JSON.parse(t);
      rows=j.map(o=>Array.isArray(o)?o:[o.date||o['날짜'],o.kind||o['구분'],o.item||o['항목'],o.amount||o.amt||o['금액']]);
    }catch(e){ importErr='JSON 해석 실패';render();return; }
  } else {
    rows=t.split(/\r?\n/).map(l=>l.split(/\t|,|\|/).map(s=>s.trim()));
  }
  applyParsed(parseTable(rows));
}
function handleImportFile(input){
  const f=input.files&&input.files[0]; if(!f)return;
  importErr=''; 
  if(/\.csv$/i.test(f.name)){
    const rd=new FileReader();
    rd.onload=()=>applyParsed(parseTable(String(rd.result).split(/\r?\n/).map(l=>l.split(','))));
    rd.readAsText(f);
    return;
  }
  /* xlsx: SheetJS 동적 로드 (인터넷 필요) */
  const run=()=>{
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false});
        applyParsed(parseTable(rows));
      }catch(e){ importErr='엑셀 해석 실패: '+e; render(); }
    };
    rd.readAsArrayBuffer(f);
  };
  if(typeof XLSX!=='undefined') run();
  else{
    const sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload=run;
    sc.onerror=()=>{importErr='엑셀 해석 도구를 불러오지 못했습니다(인터넷/차단). CSV로 저장해 올리거나 붙여넣기를 이용하세요.';render();};
    document.body.appendChild(sc);
  }
}
function applyDebtSet(rows){
  rows.forEach(r=>{
    const parts=r.item.split('>').map(s=>s.trim());
    const catName=parts[0], subName=parts[1]||null;
    let cat=S.debts.find(d=>d.name===catName);
    if(!cat){ cat={name:catName,amount:0,subs:[]}; S.debts.push(cat); }
    if(subName){
      cat.subs=cat.subs||[];
      let sub=cat.subs.find(s=>s.name===subName);
      if(!sub){ sub={name:subName,amount:0}; cat.subs.push(sub); }
      sub.amount=r.amt;
      cat.amount=cat.subs.reduce((x,s)=>x+s.amount,0);
    } else {
      if(!cat.subs||!cat.subs.length) cat.amount=r.amt;
    }
  });
}
function commitImport(){
  if(!Array.isArray(importRows)||!importRows.length)return;
  const debtRows=importRows.filter(r=>r.kind==='debtset');
  const txRows=importRows.filter(r=>r.kind!=='debtset');
  if(debtRows.length) applyDebtSet(debtRows);
  const us=units();
  const byDate={};
  txRows.forEach(r=>{
    const d=byDate[r.date]=byDate[r.date]||{revBy:{},repayBy:{},cardUse:0};
    if(r.kind==='rev'){
      const cat=(S.revCats||[]).indexOf(r.item)>=0?r.item:((S.revCats||[]).indexOf('기타')>=0&&!r.item?'기타':(r.item||'기타'));
      d.revBy[cat]=(d.revBy[cat]||0)+r.amt;
    } else if(r.kind==='repay'){
      const u=us.find(x=>x.name===r.item)||us.find(x=>x.cat===r.item);
      const key=u?u.key:(r.item||'기타');
      d.repayBy[key]=(d.repayBy[key]||0)+r.amt;
    } else d.cardUse+=r.amt;
  });
  const dates=Object.keys(byDate).sort();
  dates.forEach((dt,i)=>{
    const d=byDate[dt];
    S.entries.push({type:'week',id:Date.now()+i,date:dt+'T12:00:00.000Z',
      revenue:Object.values(d.revBy).reduce((s,v)=>s+v,0),revBy:d.revBy,
      repay:Object.values(d.repayBy).reduce((s,v)=>s+v,0),repayBy:d.repayBy,
      cardUse:d.cardUse});
  });
  S.entries.sort((a,b)=>a.date<b.date?-1:1);
  persist();
  alert('✅ '+importRows.length+'건 → '+dates.length+'개 날짜 기록'+(debtRows.length?' + 부채구성 '+debtRows.length+'건 반영':'')+' 완료했습니다.');
  importRows=null; importErr=''; go('home');
}
function setSyncUrl(){S.syncUrl=document.getElementById('set5').value.trim();S.syncToken=document.getElementById('set6').value.trim();persist();render();}
function readDebtsInputs(){
  S.debts=S.debts.map((d,i)=>{
    const subs=(d.subs||[]).map((s,j)=>({
      name:(document.getElementById('sn'+i+'_'+j)||{value:s.name}).value,
      amount:pnum((document.getElementById('sa'+i+'_'+j)||{value:s.amount}).value)}))
      .filter(s=>s.name||s.amount>0);
    const nm=(document.getElementById('dn'+i)||{value:d.name}).value||d.name;
    const amt=subs.length?subs.reduce((x,s)=>x+s.amount,0)
      :pnum((document.getElementById('da'+i)||{value:d.amount}).value);
    return {name:nm, amount:amt, subs};
  });
}
function saveDebts(){readDebtsInputs();persist();render();}
function addSub(i){readDebtsInputs();S.debts[i].subs=S.debts[i].subs||[];S.debts[i].subs.push({name:'',amount:0});render();}
function delSub(i,j){readDebtsInputs();S.debts[i].subs.splice(j,1);
  if(!S.debts[i].subs.length)S.debts[i].amount=0;persist();render();}
function addCat(){readDebtsInputs();S.debts.push({name:'',amount:0,subs:[{name:'',amount:0}]});render();}
function delCat(i){readDebtsInputs();S.debts.splice(i,1);persist();render();}
function readRevInputs(){
  S.revCats=(S.revCats||[]).map((c,i)=>(document.getElementById('rc'+i)||{value:c}).value).filter(c=>c);
}
function saveRevCats(){readRevInputs();persist();render();}
function addRevCat(){readRevInputs();S.revCats.push('');render();}
function delRevCat(i){readRevInputs();S.revCats.splice(i,1);persist();render();}
load();
